<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CX em Foco</title>
<meta name="description" content="Notícias, análises e artigos sobre atendimento, experiência do cliente e liderança.">
<meta property="og:title" content="CX em Foco">
<meta property="og:description" content="Atendimento, experiência do cliente e liderança.">
<meta property="og:type" content="website">
<meta property="og:image" content="/og-padrao.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230B7FC1'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-weight='700' font-size='28' text-anchor='middle' fill='white'%3ECX%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,600&display=swap">
<style>
/* Layout: portal de notícias — faixa escura de marca, grade de manchetes 3 colunas, blocos por editoria, faixa de opinião */
:root{
  --bg:#FFFFFF; --soft:#F4F8FB; --surface:#FFFFFF; --ink:#16212E; --ink-2:#3F4B5A; --muted:#6E7886; --line:#E3E9EF;
  --brand:#FFFFFF; --on-brand:#16212E; --brand-2:#F4F8FB; --brand-line:#E3E9EF; --brand-muted:#6E7886;
  --accent:#0B7FC1; --accent-bright:#1A9BE0; --accent-soft:#EAF5FC; --on-accent:#FFFFFF;
  --c-at:#0B7FC1; --c-cx:#7B5BD6; --c-li:#D07A12; --danger:#C0352B; --ok:#1C8A55; --warn-bg:#FFF6E8;
  --f-display:"Newsreader", Georgia, "Times New Roman", serif;
  --f-ui:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --r:4px; color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.ticker,.ticker *{-webkit-text-size-adjust:none;text-size-adjust:none}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1220px;margin:0 auto;padding-inline:20px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.kicker{font-family:var(--f-ui);font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ed,var(--accent))}
[data-ed="atendimento"]{--ed:var(--c-at)} [data-ed="experiencia"]{--ed:var(--c-cx)} [data-ed="lideranca"]{--ed:var(--c-li)}
.meta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tag-ex{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px dashed var(--muted);color:var(--muted);padding:0 5px;border-radius:3px;margin-left:6px;vertical-align:2px}

/* ---- topo ---- */
.util{background:var(--soft);color:var(--brand-muted);font-size:12.5px;border-bottom:1px solid var(--line)}
.util .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:34px;flex-wrap:wrap}
.util button{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:3px;padding:3px 10px;font-size:12px;font-weight:600}
.util button:hover,.util-btn:hover{border-color:var(--accent-bright)}
.util-btn{display:inline-block;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:3px;padding:3px 10px;font-size:12px;font-weight:600}
.mast{background:var(--brand);color:var(--on-brand)}
.mast .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:22px;flex-wrap:wrap}
.logo{display:flex;align-items:baseline;gap:10px}
.logo-mark{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1;letter-spacing:-.03em}
.logo-mark span{color:var(--accent)}
.logo-pulse{display:inline-block;width:46px;height:18px;margin-left:2px;vertical-align:1px}
.slogan{font-size:13px;line-height:1.35;white-space:pre-line;color:var(--brand-muted);max-width:34ch}
.busca-top{display:flex;align-items:center;background:var(--brand-2);border:1px solid var(--line);border-radius:3px}
.busca-top input{background:none;border:0;color:var(--ink);font:inherit;font-size:14px;padding:8px 10px;width:210px;min-width:0}
.busca-top input::placeholder{color:var(--muted)}
.busca-top button{background:none;border:0;color:var(--accent);padding:8px 10px}
nav.ed{background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
nav.ed .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.ed a{font-weight:700;font-size:13.5px;padding:13px 12px 11px;white-space:nowrap;border-bottom:3px solid transparent;color:var(--ink-2)}
nav.ed a:hover{color:var(--ink)}
nav.ed a.on{color:var(--ink);border-bottom-color:var(--ed,var(--ink))}
.ticker{background:var(--accent-soft);border-bottom:1px solid var(--line)}
.ticker .wrap{display:flex;align-items:center;gap:14px;min-height:42px;overflow:hidden}
.ticker b{flex:none;background:var(--accent);color:var(--on-accent);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:2px}
.ticker-list{flex:1;min-width:0;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent)}
.ticker-track{display:flex;gap:40px;width:max-content;padding-left:40px;animation:correr var(--dur,40s) linear infinite}
.ticker-list:hover .ticker-track,.ticker-list:focus-within .ticker-track{animation-play-state:paused}
@keyframes correr{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker-list{overflow-x:auto}.ticker-track{animation:none}}
.ticker-list a{white-space:nowrap;font-size:12.5px;font-weight:500}
.ticker-list a time{color:var(--accent);font-weight:700;margin-right:6px;font-variant-numeric:tabular-nums}
.ticker-list a:hover span{text-decoration:underline}

main{padding-block:26px 60px}
.opiniao + .wrap:empty{display:none}

/* ---- capas ---- */
.capa{position:relative;aspect-ratio:16/9;background:var(--line);overflow:hidden;border-radius:var(--r);max-width:100%}
.capa img{width:100%;height:100%;object-fit:cover;display:block}
.capa-gen{position:absolute;inset:0;background:
  repeating-linear-gradient(135deg, transparent 0 14px, rgba(255,255,255,.07) 14px 15px),
  linear-gradient(150deg, var(--ed,var(--accent)), color-mix(in srgb, var(--ed,var(--accent)) 55%, #FFFFFF));
  display:flex;align-items:flex-end;padding:14px}
.capa-gen span{font-family:var(--f-display);font-style:italic;font-weight:600;color:rgba(255,255,255,.92);font-size:clamp(18px,3vw,28px);line-height:1}
.capa-gen svg{position:absolute;right:10px;top:10px;width:38%;opacity:.35}

/* ---- home ---- */
.pub{margin-bottom:22px}
.pub-lat{margin:26px 0 0}
.pub-lat .pub-caixa{aspect-ratio:6/5}
.pub-edit .img-prev.lat img{aspect-ratio:6/5;max-width:220px}
.pub-secao{font-family:var(--f-display);font-size:24px;margin:34px 0 6px}
.pub-rot{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.pub-caixa{position:relative;border-radius:var(--r);overflow:hidden;background:var(--soft);aspect-ratio:4/1;max-width:100%}
.pub-slide{position:absolute;inset:0;opacity:0;transition:opacity .7s ease;display:block}
.pub-slide.on{opacity:1;z-index:1}
.pub-slide picture,.pub-slide img{width:100%;height:100%;object-fit:cover;display:block}
.pub-pontos{position:absolute;right:10px;bottom:8px;z-index:2;display:flex;gap:6px}
.pub-pontos button{width:8px;height:8px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.55);box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.pub-pontos button.on{background:#fff}
.pub-vazia{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;border:2px dashed var(--line);background:var(--soft);color:var(--muted);font-size:13px;text-align:center;padding:10px}
.pub-vazia b{color:var(--ink-2);font-size:14px}
.pub-edit{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.pub-edit .img-prev img{aspect-ratio:4/1;object-fit:cover}
.pub-edit .img-prev.mob img{aspect-ratio:2/1;max-width:240px}
.campo label.btn{text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--ink)}
.pub-sub{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
@media (max-width:900px){.pub-edit{grid-template-columns:minmax(0,1fr)}}
.hero{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr) minmax(0,.95fr);gap:28px}
.manchete h1{font-size:clamp(28px,3.6vw,42px);line-height:1.08;margin:12px 0 10px}
.manchete p.fina{font-family:var(--f-display);font-size:18.5px;color:var(--ink-2);margin:0 0 10px;line-height:1.4}
.manchete a:hover h1,.card a:hover h3,.sec-item a:hover h3{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px}
.mais{border-top:3px solid var(--ink);padding-top:10px}
.mais-tit{font-family:var(--f-ui);font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.mais ul{list-style:none;margin:0;padding:0}
.mais li{padding:12px 0 12px 14px;border-bottom:1px solid var(--line);position:relative}
.mais li::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:2px;background:var(--ed,var(--accent))}
.mais li:last-child{border-bottom:0}
.mais a{display:flex;flex-direction:column;gap:3px}
.mais .kicker{font-size:10.5px}
.mais-t{font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.25}
.mais a:hover .mais-t{text-decoration:underline;text-underline-offset:3px}
.col-sec{display:flex;flex-direction:column;gap:22px}
.card h3{font-size:20px;line-height:1.18;margin:8px 0 6px}
.card .capa{margin-bottom:10px}
.ultimas{border-left:1px solid var(--line);padding-left:22px}
.bloco-tit{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:3px solid var(--ed,var(--ink));padding-top:8px;margin-bottom:14px}
.bloco-tit h2{font-family:var(--f-ui);font-size:15px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ed,var(--ink))}
.bloco-tit a{font-size:12.5px;font-weight:700;color:var(--muted)}
.bloco-tit a:hover{color:var(--ink)}
.ult-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ult-list li{padding:11px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:48px 1fr;gap:10px}
.ult-list li:first-child{padding-top:0}
.ult-list time{font-weight:700;color:var(--accent);font-size:12.5px;font-variant-numeric:tabular-nums;padding-top:2px}
.ult-list a{font-family:var(--f-display);font-weight:600;font-size:16px;line-height:1.25}
.ult-list a:hover{text-decoration:underline}
.secao{margin-top:44px}
.grade4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.grade4 .card h3{font-size:18px}
.opiniao{background:var(--accent-soft);color:var(--ink);margin-top:48px;padding-block:34px 38px}
.opiniao .bloco-tit{border-top-color:var(--accent)}
.opiniao .bloco-tit h2{color:var(--accent)}
.opiniao .bloco-tit a{color:var(--muted)}
.op-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
.op a{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:start}
.avatar{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:17px;background:var(--surface);color:var(--accent);border:1px solid var(--line)}
.op h3{font-size:20px;line-height:1.2;color:var(--ink);font-style:italic;font-weight:600}
.op .autor{font-size:12.5px;color:var(--muted);margin-top:6px}
.op a:hover h3{text-decoration:underline;text-underline-offset:3px}

/* ---- seção / busca ---- */
.sec-head{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:26px}
.sec-head h1{font-size:clamp(34px,5vw,54px);line-height:1;color:var(--ed,var(--ink))}
.sec-head p{color:var(--muted);margin:10px 0 0;max-width:60ch}
.sec-lista{display:flex;flex-direction:column;gap:0}
.sec-item{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:22px;padding:20px 0;border-bottom:1px solid var(--line)}
.sec-item h3{font-size:23px;line-height:1.15;margin:6px 0 8px}
.sec-item p{margin:0 0 8px;color:var(--ink-2);font-family:var(--f-display);font-size:16.5px}
.sec-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:40px}
.busca-grande{display:flex;gap:8px;margin-top:14px}
.busca-grande input{flex:1;min-width:0;font:inherit;font-size:17px;padding:12px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r)}

/* ---- matéria ---- */
.materia{max-width:760px;margin:0 auto}
.materia h1{font-size:clamp(30px,4.4vw,48px);line-height:1.06;margin:12px 0 14px}
.materia .fina{font-family:var(--f-display);font-size:21px;line-height:1.4;color:var(--ink-2);margin:0 0 20px}
.byline{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0;margin-bottom:22px;flex-wrap:wrap}
.byline .avatar{width:40px;height:40px;font-size:14px;background:var(--accent-soft);color:var(--accent);border-color:var(--line)}
.byline strong{display:block;font-size:14px}
.legenda{font-size:12.5px;color:var(--muted);margin:8px 0 26px}
.corpo{font-family:var(--f-display);font-size:19.5px;line-height:1.65;color:var(--ink)}
.corpo p{margin:0 0 1.1em}
.corpo h2{font-size:26px;margin:1.5em 0 .5em;line-height:1.2}
.corpo blockquote{margin:1.4em 0;padding:4px 0 4px 22px;border-left:4px solid var(--ed,var(--accent));font-style:italic;font-size:23px;line-height:1.4;color:var(--ink-2)}
.corpo ul,.corpo ol{padding-left:1.3em;margin:0 0 1.1em}
.corpo li{margin-bottom:.35em}
.corpo a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.corpo > p:first-child::first-letter{font-size:3.3em;float:left;line-height:.85;margin:.06em .08em 0 0;font-weight:700;color:var(--ed,var(--accent))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.compart{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:30px 0 0;padding-top:18px;border-top:1px solid var(--line)}
.compart span{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.compart a,.compart button{font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:99px}
.compart a:hover,.compart button:hover{border-color:var(--accent);color:var(--accent)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:30px 0 0}
.tags a{font-size:12.5px;font-weight:600;border:1px solid var(--line);padding:4px 10px;border-radius:99px;color:var(--ink-2);background:var(--surface)}
.tags a:hover{border-color:var(--ink-2)}
.leia{max-width:1000px;margin:54px auto 0}
.grade3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.voltar{font-size:13px;font-weight:700;color:var(--muted);display:inline-block;margin-bottom:18px}
.voltar:hover{color:var(--ink)}

/* ---- vazio ---- */
.vazio{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:48px 28px;text-align:center;max-width:640px;margin:20px auto}
.vazio h2{font-size:28px;margin-bottom:10px}
.vazio p{color:var(--ink-2);margin:0 auto 20px;max-width:48ch}

/* ---- botões / redação ---- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:var(--r);font-weight:700;font-size:13.5px}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.perigo{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.btn.pequeno{padding:4px 10px;font-size:12.5px}
.redacao-top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.redacao-top h1{font-size:40px}
.abas{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.abas a{padding:10px 14px;font-weight:700;font-size:13.5px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.abas a.on{color:var(--ink);border-bottom-color:var(--accent)}
.tabela-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13.5px}
th{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--soft)}
td.tit{font-family:var(--f-display);font-weight:600;font-size:15.5px;max-width:380px}
td.acoes{white-space:nowrap;text-align:right}
td.acoes .btn{margin-left:4px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:.03em}
.pill.pub{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.pill.ras{background:var(--warn-bg);color:var(--c-li)}
.star{background:none;border:0;font-size:18px;line-height:1;color:var(--line);padding:2px 4px}
.star.on{color:var(--c-li)}
.form-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:26px;align-items:start}
.painel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:16px}
.campo{display:flex;flex-direction:column;gap:6px}
.campo label{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.campo small{color:var(--muted);font-size:12px}
.campo input,.campo select,.campo textarea{font:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);width:100%;min-width:0}
.campo input.titulo{font-family:var(--f-display);font-size:22px;font-weight:600}
.campo textarea{font-family:var(--f-display);font-size:17px;line-height:1.6;min-height:380px;resize:vertical}
.campo textarea.fina{min-height:70px;font-size:16px}
.toolbar{display:flex;gap:4px;flex-wrap:wrap}
.toolbar button{border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:4px 9px;font-size:12.5px;font-weight:700}
.toolbar button:hover{border-color:var(--ink-2)}
.dois{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.img-prev{border:1px dashed var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px}
.img-prev img{border-radius:3px;aspect-ratio:16/9;object-fit:cover;width:100%}
.check{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.aviso{font-size:13px;padding:10px 12px;border-radius:var(--r);background:var(--warn-bg);color:var(--ink)}
.guia{font-size:12.5px;color:var(--ink-2);line-height:1.6}
.guia code{background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:0 4px;font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:var(--r);font-weight:700;font-size:14px;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.prev-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px 20px;margin-top:20px}
.prev-rot{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}

footer{background:var(--soft);border-top:1px solid var(--line);color:var(--muted);padding-block:34px;font-size:13px}
footer .wrap{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}
footer .logo-mark{font-size:28px;color:var(--ink)}
footer nav{display:flex;gap:18px;flex-wrap:wrap}
footer nav a:hover{color:var(--accent)}

@media (max-width:1000px){
  .hero{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
  .ultimas{grid-column:1/-1;border-left:0;padding-left:0}
  .grade4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sec-layout,.form-grid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:680px){
  .wrap{padding-inline:16px}
  .hero,.op-grid,.grade3{grid-template-columns:minmax(0,1fr)}
  .grade4{grid-template-columns:minmax(0,1fr)}
  .sec-item{grid-template-columns:minmax(0,1fr);gap:10px}
  .busca-top input{width:140px}
  .ticker-list a,.ticker-list a span,.ticker-list a time{font-size:10.5px;line-height:1.3}
  .ticker b{font-size:10px;padding:3px 6px}
  .ticker .wrap{gap:10px;min-height:38px}
  .pub{margin-bottom:18px}
  .pub-caixa.tem-mob{aspect-ratio:2/1}
  .logo-mark{font-size:32px}
  .corpo{font-size:18px}
  .dois{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){ .capa img{transition:transform .5s} a:hover .capa img{transform:scale(1.03)} }
</style>
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>


<div class="util"><div class="wrap">
  <span id="hoje"></span>
  <span id="util-dir"></span>
</div></div>
<header class="mast"><div class="wrap">
  <a href="/#" class="logo" aria-label="Página inicial">
    <span class="logo-mark" id="logo-nome"><span>CX</span> em Foco</span>
    <svg class="logo-pulse" viewBox="0 0 46 18" fill="none" aria-hidden="true"><path d="M0 11h12l3-8 5 14 4-10 3 4h19" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/></svg>
  </a>
  <span class="slogan" id="slogan"></span>
  <form class="busca-top" id="form-busca-top" role="search">
    <input id="busca-top" type="search" placeholder="Buscar matérias" aria-label="Buscar matérias">
    <button aria-label="Buscar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button>
  </form>
</div></header>
<nav class="ed" aria-label="Editorias"><div class="wrap" id="nav"></div></nav>
<div class="ticker" id="ticker" hidden><div class="wrap"><b>Últimas</b><div class="ticker-list" id="ticker-list"></div></div></div>
<main id="main"><div class="vazio"><h2>Carregando matérias…</h2><p>As notícias e artigos aparecem aqui em instantes.</p></div></main>
<footer><div class="wrap">
  <div><span class="logo-mark" id="rodape-nome"><span style="color:var(--accent)">CX</span> em Foco</span><p id="rodape-sobre" style="max-width:48ch;margin:8px 0 0"></p></div>
  <nav id="rodape-nav"></nav>
</div></footer>
<div class="toast" id="toast" hidden></div>

<script>
const EDITORIAS = {
  atendimento:{nome:"Atendimento", desc:"Canais, operação, qualidade e as pessoas na linha de frente."},
  experiencia:{nome:"Experiência do Cliente", desc:"Jornada, métricas, pesquisa e tudo o que molda a percepção do cliente."},
  lideranca:{nome:"Liderança", desc:"Gestão de times, cultura e decisões que sustentam a experiência."}
};
const S = {
  artigos:[], rascunhos:[], config:{nome:"CX em Foco", slogan:"Atendimento, experiência\ndo cliente e liderança", sobre:"Notícias, análises e artigos sobre atendimento, experiência do cliente e liderança."},
  carregado:false, editor:false, demo:false, pub:null, pubForm:null, latForm:null, erroCarga:"", editandoId:null, form:null, confirmar:null, busca:"", prev:false
};

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60) || "materia";
const idsUsados = excluir => new Set([...S.artigos,...S.rascunhos].map(a=>a.id).filter(x=>x!==excluir));
function novoId(t, excluir){ const base=slug(t).slice(0,80)||"materia", u=idsUsados(excluir); let id=base, n=2; while(u.has(id)) id=base+"-"+(n++); return id; }
const iniciais = n => String(n||"R").split(/\s+/).filter(Boolean).slice(0,2).map(p=>p[0].toUpperCase()).join("");
function dataLonga(d){ return new Intl.DateTimeFormat("pt-BR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(d); }
function hora(iso){ const d=new Date(iso); return isNaN(d)?"":d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}); }
function quando(iso){
  const d=new Date(iso); if(isNaN(d)) return "";
  const min=(Date.now()-d)/60000;
  if(min>=0 && min<60) return `há ${Math.max(1,Math.round(min))} min`;
  if(min>=0 && min<60*12) return `há ${Math.round(min/60)} h`;
  return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"short",year:"numeric"}).replace(".","") + " às " + hora(iso);
}
function horaCurta(iso){ const d=new Date(iso); const hoje=new Date(); return d.toDateString()===hoje.toDateString()? hora(iso) : d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"}); }
const leitura = t => Math.max(1, Math.round(String(t||"").split(/\s+/).length/200));
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2600); }

/* texto simples -> HTML (## subtítulo, > citação, - lista, 1. lista, **negrito**, *itálico*, [texto](link)) */
function inline(s){
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
    .replace(/(^|[^*])\*(?!\s)(.+?)\*/g,"$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function corpoHTML(txt){
  return String(txt||"").replace(/\r/g,"").split(/\n\s*\n/).map(b=>{
    b=b.trim(); if(!b) return "";
    const linhas=b.split("\n");
    if(b.startsWith("## ")) return `<h2>${inline(b.slice(3))}</h2>`;
    if(linhas.every(l=>l.startsWith(">"))) return `<blockquote>${inline(linhas.map(l=>l.replace(/^>\s?/,"")).join(" "))}</blockquote>`;
    if(linhas.every(l=>/^[-•]\s/.test(l))) return `<ul>${linhas.map(l=>`<li>${inline(l.replace(/^[-•]\s/,""))}</li>`).join("")}</ul>`;
    if(linhas.every(l=>/^\d+[.)]\s/.test(l))) return `<ol>${linhas.map(l=>`<li>${inline(l.replace(/^\d+[.)]\s/,""))}</li>`).join("")}</ol>`;
    return `<p>${linhas.map(inline).join("<br>")}</p>`;
  }).join("");
}

/* ---------- peças ---------- */
function capa(a, grande){
  if(a.imagem) return `<div class="capa"><img src="${esc(a.imagem)}" alt="${esc(a.legenda||a.titulo)}" loading="lazy"></div>`;
  const nome = EDITORIAS[a.editoria]?.nome || "";
  return `<div class="capa" data-ed="${esc(a.editoria)}"><div class="capa-gen">
    <svg viewBox="0 0 46 18" fill="none"><path d="M0 11h12l3-8 5 14 4-10 3 4h19" stroke="#fff" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
    <span>${esc(nome)}</span></div></div>`;
}
const kicker = a => `<span class="kicker" data-ed="${esc(a.editoria)}">${a.tipo==="artigo"?"Opinião · ":""}${esc(EDITORIAS[a.editoria]?.nome||"")}</span>${a.exemplo?'<span class="tag-ex">Exemplo</span>':""}`;
const link = a => `/materia/${a.id}`;
function card(a, opts={}){
  return `<article class="card"><a href="${link(a)}">${opts.semCapa?"":capa(a)}${kicker(a)}<h3>${esc(a.titulo)}</h3>${opts.fina&&a.linhaFina?`<p class="meta" style="font-size:14px;color:var(--ink-2);margin:0 0 6px">${esc(a.linhaFina)}</p>`:""}<div class="meta">${esc(quando(a.publicadoEm))}</div></a></article>`;
}
function bloco(titulo, href, ed){ return `<div class="bloco-tit" ${ed?`data-ed="${ed}"`:""}><h2>${esc(titulo)}</h2>${href?`<a href="${href}">Ver tudo →</a>`:""}</div>`; }
function ultimasLista(lista){
  return `<ul class="ult-list">${lista.map(a=>`<li><time>${esc(horaCurta(a.publicadoEm))}</time><a href="${link(a)}">${esc(a.titulo)}</a></li>`).join("")}</ul>`;
}

/* ---------- dados derivados ---------- */
const publicados = () => S.artigos.filter(a => new Date(a.publicadoEm) <= new Date(Date.now()+60000) || S.editor);
function ordenar(l){ return [...l].sort((a,b)=> new Date(b.publicadoEm)-new Date(a.publicadoEm)); }

/* ---------- telas ---------- */
function telaVazia(){
  return `${blocoPub()}<div class="vazio"><span class="kicker">Portal pronto</span><h2 style="margin-top:8px">Nenhuma matéria publicada ainda</h2>
  <p>${S.editor?"Escreva a primeira notícia ou artigo na Redação. Ela aparece aqui como manchete assim que você publicar.":"Volte em breve para ler as primeiras notícias e artigos."}</p>
  ${S.editor?`<a class="btn pri" href="/#redacao-nova">Escrever primeira matéria</a>`:""}</div>`;
}
function telaHome(){
  const todos = ordenar(publicados());
  if(!todos.length) return telaVazia();
  const noticias = todos.filter(a=>a.tipo!=="artigo");
  const base = noticias.length?noticias:todos;
  const destaques = base.filter(a=>a.destaque);
  const manchete = destaques[0] || base[0];
  const secund = [...destaques.slice(1), ...base.filter(a=>!a.destaque)].filter(a=>a!==manchete).slice(0,2);
  const usados = new Set([manchete, ...secund].map(a=>a.id));
  let h = `<section class="hero">
    <div class="col-esq">${blocoPub()}<article class="manchete"><a href="${link(manchete)}">${capa(manchete)}<div style="margin-top:14px">${kicker(manchete)}</div><h1>${esc(manchete.titulo)}</h1>${manchete.linhaFina?`<p class="fina">${esc(manchete.linhaFina)}</p>`:""}<div class="meta">${esc(manchete.autor||"Redação")} · ${esc(quando(manchete.publicadoEm))}</div></a></article></div>
    <div class="col-sec">${secund.map(a=>card(a)).join("") || ""}${(()=>{ const mais=todos.filter(a=>a.id!==manchete.id && !secund.includes(a)).slice(0,6); return mais.length?`<div class="mais"><div class="mais-tit">Mais notícias</div><ul>${mais.map(a=>`<li data-ed="${esc(a.editoria)}"><a href="${link(a)}"><span class="kicker" data-ed="${esc(a.editoria)}">${esc(EDITORIAS[a.editoria]?.nome||"")}</span><span class="mais-t">${esc(a.titulo)}</span></a></li>`).join("")}</ul></div>`:""; })()}</div>
    <aside class="ultimas">${bloco("Últimas")}${ultimasLista(todos.slice(0,8))}${blocoPubLat()}</aside>
  </section>`;
  for(const [k,e] of Object.entries(EDITORIAS)){
    const l = todos.filter(a=>a.editoria===k && a.id!==manchete.id).slice(0,4);
    if(!l.length) continue;
    h += `<section class="secao">${bloco(e.nome,"#"+k,k)}<div class="grade4">${l.map(a=>card(a)).join("")}</div></section>`;
  }
  const ops = todos.filter(a=>a.tipo==="artigo").slice(0,3);
  if(ops.length){
    h += `</div><section class="opiniao"><div class="wrap">${bloco("Opinião","#opiniao")}<div class="op-grid">${ops.map(a=>`<article class="op"><a href="${link(a)}"><span class="avatar">${esc(iniciais(a.autor))}</span><div><span class="kicker" data-ed="${esc(a.editoria)}" >${esc(EDITORIAS[a.editoria]?.nome||"")}</span><h3>${esc(a.titulo)}</h3><div class="autor">${esc(a.autor||"Redação")}${a.cargoAutor?" · "+esc(a.cargoAutor):""}</div></div></a></article>`).join("")}</div></div></section><div class="wrap">`;
  }
  return h;
}
function listaSecao(l){
  return `<div class="sec-lista">${l.map(a=>`<article class="sec-item"><a href="${link(a)}">${capa(a)}</a><div><a href="${link(a)}">${kicker(a)}<h3>${esc(a.titulo)}</h3></a>${a.linhaFina?`<p>${esc(a.linhaFina)}</p>`:""}<div class="meta">${esc(a.autor||"Redação")} · ${esc(quando(a.publicadoEm))}</div></div></article>`).join("")}</div>`;
}
function telaSecao(k){
  const todos = ordenar(publicados());
  const opin = k==="opiniao";
  const l = opin ? todos.filter(a=>a.tipo==="artigo") : todos.filter(a=>a.editoria===k);
  const nome = opin?"Opinião":EDITORIAS[k].nome, desc = opin?"Artigos assinados, análises e pontos de vista.":EDITORIAS[k].desc;
  return `<header class="sec-head" ${opin?"":`data-ed="${k}"`}><h1>${esc(nome)}</h1><p>${esc(desc)}</p></header>
  <div class="sec-layout"><div>${l.length?listaSecao(l):`<p class="meta" style="font-size:15px">Ainda não há matérias nesta editoria.</p>`}</div>
  <aside>${bloco("Últimas")}${ultimasLista(todos.slice(0,6))}${blocoPubLat()}</aside></div>`;
}
function telaBusca(){
  const q = S.busca.trim().toLowerCase();
  const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
  const nq = norm(q);
  const res = q ? ordenar(publicados()).filter(a => norm([a.titulo,a.linhaFina,a.corpo,(a.tags||[]).join(" "),a.autor].join(" ")).includes(nq)) : [];
  return `<header class="sec-head"><h1>Busca</h1>
  <form class="busca-grande" id="form-busca"><input id="busca-campo" type="search" value="${esc(S.busca)}" placeholder="Palavra-chave, tema ou autor" aria-label="Buscar"><button class="btn pri">Buscar</button></form></header>
  ${q?`<p class="meta" style="font-size:14px">${res.length} resultado${res.length===1?"":"s"} para “${esc(S.busca)}”</p>${listaSecao(res)}`:""}`;
}
function artigoHTML(a){
  return `<article class="materia" data-ed="${esc(a.editoria)}">
    ${kicker(a)}<h1>${esc(a.titulo)}</h1>${a.linhaFina?`<p class="fina">${esc(a.linhaFina)}</p>`:""}
    <div class="byline"><span class="avatar">${esc(iniciais(a.autor))}</span><div><strong>${esc(a.autor||"Redação")}</strong><span class="meta">${a.cargoAutor?esc(a.cargoAutor)+" · ":""}${esc(quando(a.publicadoEm))}${a.atualizadoEm&&a.atualizadoEm!==a.publicadoEm&&new Date(a.atualizadoEm)-new Date(a.publicadoEm)>3600000?" · atualizado "+esc(quando(a.atualizadoEm)):""} · ${leitura(a.corpo)} min de leitura</span></div></div>
    ${capa(a)}${a.legenda?`<p class="legenda">${esc(a.legenda)}</p>`:`<div style="height:26px"></div>`}
    <div class="corpo">${corpoHTML(a.corpo)}</div>
    ${a.id?`<div class="compart"><span>Compartilhe</span>
      <a href="https://wa.me/?text=${encodeURIComponent(a.titulo+" "+location.origin+"/materia/"+a.id)}" target="_blank" rel="noopener">WhatsApp</a>
      <a href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(location.origin+"/materia/"+a.id)}" target="_blank" rel="noopener">LinkedIn</a>
      <button type="button" data-copiar="${esc(location.origin+"/materia/"+a.id)}">Copiar link</button></div>`:""}
    ${(a.tags||[]).length?`<div class="tags">${a.tags.map(t=>`<a href="/#busca" data-tag="${esc(t)}">${esc(t)}</a>`).join("")}</div>`:""}
  </article>`;
}
function telaMateria(id){
  const a = S.artigos.find(x=>x.id===id) || (S.editor && S.rascunhos.find(x=>x.id===id));
  if(!a) return `<div class="vazio"><h2>Matéria não encontrada</h2><p>Ela pode ter sido removida ou ainda não foi publicada.</p><a class="btn" href="/#">Voltar à capa</a></div>`;
  const rel = ordenar(publicados()).filter(x=>x.id!==a.id && x.editoria===a.editoria).slice(0,3);
  const extra = rel.length<3 ? ordenar(publicados()).filter(x=>x.id!==a.id && !rel.includes(x)).slice(0,3-rel.length) : [];
  return `<a class="voltar" href="/#${a.tipo==="artigo"?"opiniao":a.editoria}">← ${a.tipo==="artigo"?"Opinião":esc(EDITORIAS[a.editoria]?.nome)}</a>
  ${S.rascunhos.includes(a)?`<div class="aviso" style="max-width:760px;margin:0 auto 18px">Rascunho — só a Redação vê esta página.</div>`:""}
  ${S.editor?`<div style="max-width:760px;margin:0 auto 14px;text-align:right"><button class="btn pequeno" data-editar="${esc(a.id)}">Editar matéria</button></div>`:""}
  ${artigoHTML(a)}
  ${[...rel,...extra].length?`<section class="leia">${bloco("Leia também")}<div class="grade3">${[...rel,...extra].map(x=>card(x)).join("")}</div></section>`:""}`;
}

/* ---------- redação ---------- */
function abas(on){
  return `<div class="redacao-top"><div><span class="kicker">Área restrita</span><h1>Redação</h1></div><a class="btn pri" href="/#redacao-nova">+ Nova matéria</a></div>
  <nav class="abas"><a href="/#redacao" class="${on==="lista"?"on":""}">Matérias</a><a href="/#redacao-nova" class="${on==="form"&&!S.editandoId?"on":""}">${S.editandoId&&on==="form"?"Editando":"Nova matéria"}</a>${S.editandoId&&on==="form"?`<a class="on">Editando</a>`:""}<a href="/#redacao-pub" class="${on==="pub"?"on":""}">Publicidade</a><a href="/#redacao-config" class="${on==="config"?"on":""}">Configurações do site</a></nav>`;
}
function telaRedacaoLista(){
  const linhas = [...S.rascunhos.map(a=>({...a,_st:"ras"})), ...ordenar(S.artigos).map(a=>({...a,_st:"pub"}))];
  const nEx = [...S.artigos,...S.rascunhos].filter(a=>a.exemplo).length;
  return abas("lista") + (nEx?`<div class="aviso" style="margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><span>${nEx} matérias de exemplo estão no ar para mostrar o layout. Apague quando publicar as suas.</span>${S.confirmar==="exemplos"?`<span><button class="btn pequeno perigo" data-acao="apagar-exemplos">Confirmar exclusão dos exemplos</button> <button class="btn pequeno" data-acao="cancelar">Cancelar</button></span>`:`<button class="btn pequeno perigo" data-acao="pedir-exemplos">Apagar exemplos</button>`}</div>`:"") +
  (linhas.length?`<div class="tabela-wrap"><table><thead><tr><th title="Destaque na capa">★</th><th>Título</th><th>Editoria</th><th>Tipo</th><th>Status</th><th>Data</th><th></th></tr></thead><tbody>
  ${linhas.map(a=>`<tr>
    <td>${a._st==="pub"?`<button class="star ${a.destaque?"on":""}" data-destaque="${esc(a.id)}" aria-label="${a.destaque?"Tirar do destaque":"Pôr em destaque"}" title="${a.destaque?"Em destaque na capa":"Pôr em destaque na capa"}">★</button>`:""}</td>
    <td class="tit"><a href="${link(a)}">${esc(a.titulo)}</a>${a.exemplo?'<span class="tag-ex">Exemplo</span>':""}</td>
    <td><span class="kicker" data-ed="${esc(a.editoria)}">${esc(EDITORIAS[a.editoria]?.nome||"")}</span></td>
    <td>${a.tipo==="artigo"?"Artigo":"Notícia"}</td>
    <td><span class="pill ${a._st}">${a._st==="pub"?(new Date(a.publicadoEm)>new Date()?"Agendada":"Publicada"):"Rascunho"}</span></td>
    <td class="meta">${new Date(a.publicadoEm).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"})}</td>
    <td class="acoes">${S.confirmar===a.id?`<button class="btn pequeno perigo" data-excluir="${esc(a.id)}">Confirmar exclusão</button><button class="btn pequeno" data-acao="cancelar">Cancelar</button>`:`<button class="btn pequeno" data-editar="${esc(a.id)}">Editar</button><button class="btn pequeno perigo" data-pedir="${esc(a.id)}">Excluir</button>`}</td>
  </tr>`).join("")}</tbody></table></div>`:`<div class="vazio"><h2>Nenhuma matéria ainda</h2><p>Comece pela primeira notícia ou artigo.</p><a class="btn pri" href="/#redacao-nova">Escrever matéria</a></div>`);
}
function localISO(iso){ const d=new Date(iso||Date.now()); const p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }
function telaRedacaoForm(){
  const f = S.form;

/* ---------- roteamento / render ---------- */
function rota(){
  const m=location.pathname.match(/^\/materia\/([^\/?#]+)/);
  if(m) return "m-"+decodeURIComponent(m[1]);
  return decodeURIComponent(location.hash.replace(/^#/,""));
}
function irPara(r){
  const url = r.startsWith("m-") ? "/materia/"+encodeURIComponent(r.slice(2)) : (r ? "/#"+r : "/");
  history.pushState(null,"",url); aoMudarRota();
}
function renderShell(){
  const c=S.config, n=c.nome||"CX em Foco";
  const mi=n.match(/^([A-Z]{2,4})(\s.+)$/), mf=n.match(/^(.+?)\s?([A-Z]{2,4})$/);
  const logo = mi ? `<span>${esc(mi[1])}</span>${esc(mi[2])}` : mf ? `${esc(mf[1])}<span>${esc(mf[2])}</span>` : esc(n);
  $("#logo-nome").innerHTML=logo; $("#rodape-nome").innerHTML=logo.replace("<span>",'<span style="color:var(--accent)">');
  $("#slogan").textContent=c.slogan||""; $("#rodape-sobre").textContent=c.sobre||"";
  document.title = n;
  $("#hoje").textContent = dataLonga(new Date()).replace(/^./,x=>x.toUpperCase());
  $("#util-dir").innerHTML = `<a class="util-btn" href="/#redacao"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" style="vertical-align:-1px;margin-right:5px" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Redação</a>${S.editor&&!S.demo?` <button data-acao="sair">Sair</button>`:""}`;
  const r=rota();
  const itens=[["","Capa"],...Object.entries(EDITORIAS).map(([k,e])=>[k,e.nome]),["opiniao","Opinião"]];
  const ativo = r.startsWith("m-") ? (S.artigos.find(a=>"m-"+a.id===r)?.editoria) : r;
  $("#nav").innerHTML = itens.map(([k,t])=>`<a href="/#${k}" ${EDITORIAS[k]?`data-ed="${k}"`:""} class="${ativo===k?"on":""}">${t}</a>`).join("");
  $("#rodape-nav").innerHTML = itens.slice(1).map(([k,t])=>`<a href="/#${k}">${t}</a>`).join("") + `<a href="/#redacao">Redação</a>`;
  const ult = ordenar(publicados()).slice(0,6);
  $("#ticker").hidden = !ult.length || r.startsWith("redacao");
  const itensT = ult.map(a=>`<a href="${link(a)}"><time>${esc(horaCurta(a.publicadoEm))}</time><span>${esc(a.titulo)}</span></a>`).join("");
  const chaveT = ult.map(a=>a.id+a.titulo).join("|");
  if(chaveT!==renderShell._t){ renderShell._t=chaveT;
    $("#ticker-list").innerHTML = `<div class="ticker-track" style="--dur:${Math.max(25, ult.length*9)}s">${itensT}${itensT.replace(/<a /g,'<a tabindex="-1" aria-hidden="true" ')}</div>`; }
}
function render(scrollTop){
  renderShell();
  const r=rota(), main=$("#main");
  if(!S.carregado){ return; }
  if(S.erroCarga && !r.startsWith("redacao")){ main.innerHTML=`<div class="wrap"><div class="vazio"><h2>Não foi possível carregar as matérias</h2><p>${esc(S.erroCarga)}</p></div></div>`; return; }
  if(r.startsWith("redacao") && !S.editor){ main.innerHTML=`<div class="wrap">${telaLogin()}</div>`; return; }
  let h;
  if(r==="") h=telaHome();
  else if(EDITORIAS[r]||r==="opiniao") h=telaSecao(r);
  else if(r==="busca") h=telaBusca();
  else if(r.startsWith("m-")) h=telaMateria(r.slice(2));
  else if(r==="redacao") h=telaRedacaoLista();
  else if(r==="redacao-nova"||r==="redacao-editar"){ if(!S.form) abrirForm(r==="redacao-editar"?S.editandoId:null); h=telaRedacaoForm(); }
  else if(r==="redacao-config") h=telaRedacaoConfig();
  else if(r==="redacao-pub"){ if(!S.pubForm) S.pubForm=JSON.parse(JSON.stringify(pubItens(true))); if(!S.latForm) S.latForm=JSON.parse(JSON.stringify(latItens(true))); h=telaRedacaoPub(); }
  else h=telaHome();
  const aviso = S.demo && r.startsWith("redacao") ? `<div class="aviso" style="margin-bottom:18px"><b>Modo demonstração.</b> O site ainda não está ligado ao Supabase, então o que você publica aqui fica só neste navegador. Siga o arquivo LEIA-ME para ativar o banco de dados.</div>` : "";
  main.innerHTML=`<div class="wrap">${aviso}${h}</div>`;
  if(r.startsWith("m-")){ const am=[...S.artigos,...S.rascunhos].find(x=>x.id===r.slice(2)); if(am) document.title = am.titulo+" | "+(S.config.nome||"CX em Foco"); }
  iniciarCarrossel();
  ajustarMais();
  if(scrollTop) window.scrollTo(0,0);
}
function formAberto(){ const r=rota(); return r==="redacao-nova"||r==="redacao-editar"||r==="redacao-config"||r==="redacao-pub"; }
function renderSeguro(){ if(formAberto()) renderShell(); else render(false); }

/* ---------- formulário ---------- */
function abrirForm(id){
  const a = id && ([...S.artigos,...S.rascunhos].find(x=>x.id===id));
  S.editandoId = a?id:null; S.prev=false;
  S.form = a ? {...a, status: S.rascunhos.some(x=>x.id===id)?"rascunho":"publicado"} :
    {titulo:"",linhaFina:"",corpo:"",editoria:"atendimento",tipo:"noticia",autor:S.config.autorPadrao||"",cargoAutor:"",imagem:"",legenda:"",tags:[],destaque:false,status:"publicado",publicadoEm:new Date().toISOString()};
}
function lerForm(){
  const f=S.form; const v=id=>$(id)?.value ?? "";
  Object.assign(f,{titulo:v("#f-titulo").trim(),linhaFina:v("#f-fina").trim(),corpo:v("#f-corpo"),editoria:v("#f-editoria"),tipo:v("#f-tipo"),
    autor:v("#f-autor").trim(),cargoAutor:v("#f-cargo").trim(),legenda:v("#f-legenda").trim(),status:v("#f-status"),destaque:$("#f-destaque")?.checked||false,
    tags:v("#f-tags").split(",").map(t=>t.trim()).filter(Boolean), url:v("#f-url").trim()});
  const d=new Date(v("#f-data")); f.publicadoEm = isNaN(d)?new Date().toISOString():d.toISOString();
  return f;
}
async function salvarMateria(){
  const f=lerForm(), erro=$("#f-erro");
  if(!f.titulo){ erro.textContent="Dê um título à matéria."; erro.hidden=false; $("#f-titulo").focus(); return; }
  if(!f.corpo.trim()){ erro.textContent="Escreva o texto da matéria."; erro.hidden=false; $("#f-corpo").focus(); return; }
  erro.hidden=true;
  const pedido = f.url ? slug(f.url) : "";
  if(f.url && pedido!==f.url.toLowerCase()){ $("#f-url").value=pedido; }
  if(pedido && idsUsados(S.editandoId).has(pedido)){ erro.textContent="Já existe outra matéria com esse endereço. Escolha outro."; erro.hidden=false; $("#f-url").focus(); return; }
  const id = pedido || S.editandoId || novoId(f.titulo, S.editandoId);
  const idAntigo = S.editandoId && S.editandoId!==id ? S.editandoId : null;
  const {status,id:_i,exemplo,_status,url:_u,...dados} = f;
  dados.atualizadoEm = new Date().toISOString();
  if(exemplo) dados.exemplo=true;
  const btn=$("#f-salvar"); btn.disabled=true; btn.textContent="Salvando…";
  try{
    await API.salvar(id, status, dados);
    if(idAntigo) await API.excluir(idAntigo);
    await recarregar();
    toast(status==="rascunho"?"Rascunho salvo":(S.editandoId?"Matéria atualizada":"Matéria publicada"));
    S.form=null; S.editandoId=null;
    irPara(status==="rascunho" ? "redacao" : "m-"+id);
  }catch(e){
    btn.disabled=false; btn.textContent=S.editandoId?"Salvar alterações":"Publicar";
    const msg=String(e?.message||"");
    erro.textContent = /row-level security|permission/i.test(msg) ? "Sua conta não tem permissão para publicar. Confira se o e-mail do login é o mesmo que está no arquivo supabase.sql." :
      e?.message==="armazenamento" ? "O navegador não conseguiu guardar a matéria (modo demonstração). Tente uma imagem menor." :
      "Não foi possível salvar agora. Verifique sua conexão e tente de novo.";
    if(msg && msg!=="armazenamento") erro.textContent += " (Detalhe técnico: " + msg + ")";
    erro.hidden=false;
  }
}
function comprimir(file, maxW=1400, maxLen=170000){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      let w=Math.min(maxW,img.naturalWidth), q=.82, out="";
      const cv=document.createElement("canvas"), cx=cv.getContext("2d");
      for(let i=0;i<10;i++){
        cv.width=w; cv.height=Math.round(img.naturalHeight*w/img.naturalWidth);
        cx.drawImage(img,0,0,cv.width,cv.height);
        out=cv.toDataURL("image/jpeg",q);
        if(out.length<maxLen) break;
        if(q>.55) q-=.08; else w=Math.round(w*.82);
      }
      URL.revokeObjectURL(url); res(out);
    };
    img.onerror=()=>{URL.revokeObjectURL(url); rej();};
    img.src=url;
  });
}
function formatar(tipo){
  const ta=$("#f-corpo"); const s=ta.selectionStart, e=ta.selectionEnd, sel=ta.value.slice(s,e);
  const m={h2:["\n\n## ","\n\n","Subtítulo"],b:["**","**","texto"],i:["*","*","texto"],q:["\n\n> ","\n\n","Citação"],ul:["\n\n- ","\n\n","Item"],a:["[","](https://)","texto do link"]}[tipo];
  const txt=sel||m[2]; ta.setRangeText(m[0]+txt+m[1],s,e,"end"); ta.focus();
}

/* ---------- eventos ---------- */
function aoMudarRota(){
  const r=rota();
  if(r==="redacao-nova"){ abrirForm(null); }
  else if(r!=="redacao-editar"){ S.form=null; S.editandoId=null; }
  if(r!=="redacao-pub"){ S.pubForm=null; S.latForm=null; }
  S.confirmar=null; render(true);
}
window.addEventListener("hashchange",aoMudarRota);
window.addEventListener("popstate",aoMudarRota);
document.addEventListener("click",e=>{
  const a=e.target.closest("a[href]"); if(!a || a.target==="_blank" || e.ctrlKey || e.metaKey || e.shiftKey || e.button>0) return;
  const h=a.getAttribute("href");
  if(h.startsWith("/materia/") || h.startsWith("/#") || h==="/"){
    if(a.dataset.tag) return;
    e.preventDefault();
    if(location.pathname+location.hash===h) { aoMudarRota(); return; }
    history.pushState(null,"",h); aoMudarRota();
  }
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="form-busca-top"){ S.busca=$("#busca-top").value; if(rota()==="busca") render(); else irPara("busca"); }
  if(e.target.id==="form-busca"){ S.busca=$("#busca-campo").value; render(); }
  if(e.target.id==="form-materia") salvarMateria();
  if(e.target.id==="form-config") salvarConfig();
  if(e.target.id==="form-login") entrar();
});
document.addEventListener("click",async e=>{
  const cp=e.target.closest("[data-copiar]");
  if(cp){ try{ await navigator.clipboard.writeText(cp.dataset.copiar); toast("Link copiado"); }catch{ toast(cp.dataset.copiar); } return; }
  const lt=e.target.closest("[data-lattirar]");
  if(lt){ lerPubForm(); S.latForm[+lt.dataset.lattirar].imagem=""; render(); return; }
  const tp=e.target.closest("[data-pubtirar]");
  if(tp){ lerPubForm(); S.pubForm[+tp.dataset.pubtirar][tp.dataset.campo||"imagem"]=""; render(); return; }
  const t=e.target.closest("[data-editar],[data-pedir],[data-excluir],[data-destaque],[data-acao],[data-fmt],[data-tag]"); if(!t) return;
  if(t.dataset.tag){ e.preventDefault(); S.busca=t.dataset.tag; if(rota()==="busca") render(true); else irPara("busca"); return; }
  if(t.dataset.fmt){ formatar(t.dataset.fmt); return; }
  if(t.dataset.editar){ abrirForm(t.dataset.editar); rota()==="redacao-editar" ? render(true) : irPara("redacao-editar"); return; }
  if(t.dataset.pedir){ S.confirmar=t.dataset.pedir; render(); return; }
  if(t.dataset.excluir){
    try{ await API.excluir(t.dataset.excluir); await recarregar(); toast("Matéria excluída"); }catch{ toast("Não foi possível excluir. Tente de novo."); }
    S.confirmar=null; render(); return;
  }
  if(t.dataset.destaque){
    const a=S.artigos.find(x=>x.id===t.dataset.destaque); if(!a) return;
    const {id,_status,...dados}=a;
    try{ await API.salvar(id,"publicado",{...dados,destaque:!a.destaque}); await recarregar(); render(); toast(a.destaque?"Retirada do destaque":"Em destaque na capa"); }catch{ toast("Não foi possível alterar o destaque."); }
    return;
  }
  const ac=t.dataset.acao;
  if(ac==="sair"){ await API.sair(); S.editor=false; await recarregar(); irPara(""); toast("Você saiu da Redação"); return; }
  if(ac==="salvar-pub"){ t.disabled=true; await salvarPub(); t.disabled=false; return; }
  if(ac==="url-titulo"){ const tt=$("#f-titulo").value.trim(); if(!tt){ toast("Escreva o título primeiro"); return; } $("#f-url").value=novoId(tt, S.editandoId); return; }
  if(ac==="cancelar"){ S.confirmar=null; render(); }
  if(ac==="pedir-exemplos"){ S.confirmar="exemplos"; render(); }
  if(ac==="apagar-exemplos"){
    const ex=[...S.artigos,...S.rascunhos].filter(a=>a.exemplo).map(a=>a.id);
    for(const id of ex){ try{ await API.excluir(id); }catch{} }
    await recarregar(); S.confirmar=null; toast("Exemplos apagados"); render();
  }
  if(ac==="tirar-img"){ lerForm(); S.form.imagem=""; render(); }
  if(ac==="previa"){
    lerForm(); S.prev=!S.prev;
    t.textContent=S.prev?"Fechar prévia":"Prévia";
    $("#previa").innerHTML = S.prev ? `<div class="prev-box"><div class="prev-rot">Prévia — é assim que a matéria aparece no site</div>${artigoHTML({...S.form,titulo:S.form.titulo||"Título da matéria"})}</div>` : "";
    if(S.prev) $("#previa").scrollIntoView({behavior:"smooth"});
  }
});
document.addEventListener("change",async e=>{
  if(e.target.dataset && e.target.dataset.latimg!==undefined && e.target.files[0]){
    const i=+e.target.dataset.latimg; lerPubForm();
    try{ S.latForm[i].imagem = await comprimir(e.target.files[0], 600, 110000); render(); toast("Imagem carregada"); }
    catch{ toast("Não foi possível ler essa imagem. Tente um JPG ou PNG."); }
    return;
  }
  if(e.target.dataset && e.target.dataset.pubimg!==undefined && e.target.files[0]){
    const i=+e.target.dataset.pubimg; lerPubForm();
    const campo=e.target.dataset.campo||"imagem";
    try{ S.pubForm[i][campo] = await comprimir(e.target.files[0], campo==="imagemMobile"?800:1200, campo==="imagemMobile"?110000:150000); render(); toast("Imagem carregada"); }
    catch{ toast("Não foi possível ler essa imagem. Tente um JPG ou PNG."); }
    return;
  }
  if(e.target.id!=="f-img"||!e.target.files[0]) return;
  lerForm();
  try{ S.form.imagem = await comprimir(e.target.files[0]); render(); toast("Imagem carregada"); }
  catch{ toast("Não foi possível ler essa imagem. Tente um JPG ou PNG."); }
});
async function salvarConfig(){
  const c={nome:$("#c-nome").value.trim()||"CX em Foco",slogan:$("#c-slogan").value.trim(),sobre:$("#c-sobre").value.trim(),autorPadrao:$("#c-autor").value.trim()};
  try{ await API.salvarConfig(c); S.config={...S.config,...c}; renderShell(); toast("Configurações salvas"); }
  catch{ toast("Não foi possível salvar as configurações."); }
}

/* ---------- publicidade ---------- */
const PUB_VAZIA = () => [0,1,2].map(()=>({imagem:"",imagemMobile:"",link:"",alt:"",ativo:true}));
function pubItens(todos){

function ajustarMais(){
  const col=document.querySelector(".col-sec"), esq=document.querySelector(".col-esq"), lis=[...document.querySelectorAll(".mais li")];
  if(!col||!esq||!lis.length) return;
  lis.forEach(l=>l.hidden=false);
  if(window.innerWidth<=1000) { lis.slice(4).forEach(l=>l.hidden=true); return; }
  const fimEsq=()=>esq.lastElementChild.getBoundingClientRect().bottom, fimCol=()=>col.lastElementChild.getBoundingClientRect().bottom;
  for(let i=lis.length-1;i>=1 && fimCol() > fimEsq()+10;i--) lis[i].hidden=true;
}
window.addEventListener("resize",()=>{ clearTimeout(ajustarMais._t); ajustarMais._t=setTimeout(ajustarMais,150); });
function iniciarCarrossel(){
  (iniciarCarrossel._ts||[]).forEach(clearInterval); iniciarCarrossel._ts=[];
  document.querySelectorAll(".pub-caixa").forEach(cx=>{
    const slides=[...cx.querySelectorAll(".pub-slide")], pts=[...cx.querySelectorAll(".pub-pontos button")];
    if(slides.length<2) return;
    let i=0, t=null;
    const ir=n=>{ i=(n+slides.length)%slides.length; slides.forEach((s,k)=>s.classList.toggle("on",k===i)); pts.forEach((b,k)=>b.classList.toggle("on",k===i)); };
    const tocar=()=>{ clearInterval(t); t=setInterval(()=>ir(i+1),5000); iniciarCarrossel._ts.push(t); };
    pts.forEach((b,k)=>b.onclick=()=>{ ir(k); tocar(); });
    tocar();
  });
}

function lerPubForm(){

async function salvarPub(){

async function entrar(){

  if(!email||!senha){ erro.textContent="Preencha e-mail e senha."; erro.hidden=false; return; }
  b.disabled=true; b.textContent="Entrando…";
  try{ await API.entrar(email,senha); S.editor=true; await recarregar(); render(true); toast("Bem-vindo à Redação"); }
  catch(e){ b.disabled=false; b.textContent="Entrar"; const m=String(e?.message||"");
    erro.textContent = m==="sem-banco" ? "O login ainda não está ativo: conecte o Supabase seguindo o arquivo LEIA-ME." :

      /not confirmed/i.test(m) ? "Este e-mail ainda não foi confirmado no Supabase. Recrie o usuário marcando “Auto Confirm User”." :
      /api ?key/i.test(m) ? "A chave do Supabase no config.js não foi aceita. Confira a chave publicável." :

    S.editor = !!data.session;
  },
  async carregar(){
    const [m,c] = await Promise.all([
      sb.from("materias").select("id,status,publicado_em,dados").order("publicado_em",{ascending:false}).limit(1000),
      sb.from("config").select("id,dados").in("id",["site","publicidade"])
    ]);
    if(m.error) throw m.error;
    const l = (m.data||[]).map(r=>({...r.dados, id:r.id, publicadoEm:r.publicado_em, _status:r.status}));
    S.artigos = l.filter(a=>a._status==="publicado");
    S.rascunhos = S.editor ? l.filter(a=>a._status==="rascunho") : [];
    for(const r of (c.data||[])){ if(r.id==="site") S.config={...S.config,...r.dados}; if(r.id==="publicidade") S.pub=r.dados; }
  },
  async salvar(id,status,dados){
    const {error} = await sb.from("materias").upsert({id, status, publicado_em:dados.publicadoEm, dados, atualizado_em:new Date().toISOString()});
    if(error) throw error;
  },
  async excluir(id){ const {error} = await sb.from("materias").delete().eq("id",id); if(error) throw error; },
  async salvarConfig(c){ const {error} = await sb.from("config").upsert({id:"site", dados:c}); if(error) throw error; },
  async salvarPub(p){ const {error} = await sb.from("config").upsert({id:"publicidade", dados:p}); if(error) throw error; },
  async entrar(email,senha){ const {error} = await sb.auth.signInWithPassword({email:email.toLowerCase(), password:senha}); if(error) throw error; },
  async sair(){ await sb.auth.signOut(); }
} : {
  CHAVE:"cxemfoco-demo",
  async iniciar(){ S.editor=false; S.demo=true; },
  ler(){ try{ const j=JSON.parse(localStorage.getItem(this.CHAVE)||"null"); if(j) return j; }catch{} return {materias:EXEMPLOS.map(a=>({...a,_status:"publicado"})), config:null}; },
  gravar(d){ try{ localStorage.setItem(this.CHAVE, JSON.stringify(d)); }catch{ throw new Error("armazenamento"); } },
  async carregar(){ const d=this.ler(); S.artigos=d.materias.filter(a=>a._status==="publicado"); S.rascunhos=d.materias.filter(a=>a._status==="rascunho"); if(d.config) S.config={...S.config,...d.config}; if(d.publicidade) S.pub=d.publicidade; },
  async salvar(id,status,dados){ const d=this.ler(); d.materias=d.materias.filter(a=>a.id!==id); d.materias.push({...dados,id,_status:status}); this.gravar(d); },
  async excluir(id){ const d=this.ler(); d.materias=d.materias.filter(a=>a.id!==id); this.gravar(d); },
  async salvarConfig(c){ const d=this.ler(); d.config=c; this.gravar(d); },
  async salvarPub(p){ const d=this.ler(); d.publicidade=p; this.gravar(d); },
  async entrar(){ throw new Error("sem-banco"); }, async sair(){}
};
async function recarregar(){
  try{ await API.carregar(); S.erroCarga=""; }
  catch(e){ S.erroCarga="Verifique a conexão com a internet e as chaves do Supabase no arquivo config.js."; console.error(e); }
}

/* ---------- inicialização ---------- */
render();
(async()=>{
  try{ await API.iniciar(); }catch(e){ console.error(e); }
  await recarregar();
  S.carregado=true; render();
})();
</script>
</body>
